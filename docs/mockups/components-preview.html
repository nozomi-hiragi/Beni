<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beni コンポーネントプレビュー</title>
  <link rel="stylesheet" href="components-preview.css">
</head>

<body>
  <header>コンポーネントプレビュー <span>見た目の確認用</span></header>
  <div class="layout">
    <nav aria-label="コンポーネント一覧">
      <h1>コンポーネント</h1>
      <a href="#menu">メニュー</a>
    <a href="#task-create">タスク作成欄</a>
    <a href="#task-list">タスク一覧</a>
    <a href="#tab-bar">共通タブバー</a>
    <a href="#tree-view">共通ツリー</a>
    <a href="#chat-content">チャットの中身</a>
    <a href="#chat-composer">チャット入力欄</a>
    <a href="#phase-indicator">フェーズインジケーター</a>
    <a href="#project-create">プロジェクト作成ダイアログ</a>
    <a href="#connections">LLM 接続設定</a>
    </nav>
    <main>
      <section id="menu" class="panel">
        <h2>メニュー</h2><div class="preview-controls" aria-label="メニューの操作"><button type="button" onclick="menuState('home')">ホーム表示</button><button type="button" onclick="menuState('project')">プロジェクト表示</button></div><iframe id="menu-frame" title="メニューのプレビュー" src="components/menu.html"></iframe>
      </section>
      <section id="task-create" class="panel"><h2>タスク作成欄</h2><iframe title="タスク作成欄のプレビュー" src="components/task-create.html"></iframe></section>
      <section id="task-list" class="panel"><h2>タスク一覧</h2><iframe title="タスク一覧のプレビュー" src="components/task-list.html"></iframe></section>
      <section id="tree-view" class="panel"><h2>共通ツリー</h2><iframe title="共通ツリーのプレビュー" src="components/tree-view.html#exampleTree"></iframe></section>
      <section id="tab-bar" class="panel"><h2>共通タブバー</h2><div class="preview-controls" aria-label="タブバーの表示切り替え"><button type="button" onclick="tabBarState('tree')">チャット・プレビュー用</button><button type="button" onclick="tabBarState('terminal')">ターミナル用</button></div><iframe id="tab-bar-frame" title="共通タブバーのプレビュー" src="components/tab-bar.html" onload="tabBarState('tree')"></iframe></section>
      <section id="chat-content" class="panel"><h2>チャットの中身</h2><iframe title="チャットの中身のプレビュー" src="components/chat-content.html"></iframe></section>
      <section id="chat-composer" class="panel"><h2>チャット入力欄</h2><iframe title="チャット入力欄のプレビュー" src="components/chat-composer.html"></iframe></section>
      <section id="phase-indicator" class="panel"><h2>フェーズインジケーター</h2><iframe title="フェーズインジケーターのプレビュー" src="components/phase-indicator.html"></iframe></section>
      <section id="project-create" class="panel"><h2>プロジェクト作成ダイアログ</h2><iframe title="プロジェクト作成ダイアログ" src="components/project-create-dialog.html"></iframe></section>
      <section id="connections" class="panel"><h2>LLM 接続設定</h2><iframe title="LLM 接続設定のプレビュー" src="components/connections.html"></iframe></section>
    <p id="preview-error" role="status"></p>
    <p class="placeholder">左からコンポーネントを選んでください。</p>
    </main>
  </div>
<script>
function tabBarState(mode) {
  try {
    const doc = document.getElementById('tab-bar-frame').contentDocument;
    const tree = doc.querySelector('.tab-left'), add = doc.querySelector('.tab-right'), tabs = doc.querySelector('.tab-items');
    if (!tree || !add || !tabs) return;
    tree.classList.toggle('hidden', mode === 'terminal'); add.classList.toggle('hidden', mode !== 'terminal'); tree.textContent = '☰'; add.textContent = '＋';
    tabs.replaceChildren();
    function addSample(label) { const item = doc.createElement('span'); item.className = 'tab-item'; const button = doc.createElement('button'); button.className = 'tab-label'; button.textContent = label; if (!tabs.children.length) button.classList.add('active'); button.onclick = () => { tabs.querySelectorAll('.tab-label').forEach(tab => tab.classList.remove('active')); button.classList.add('active'); }; const close = doc.createElement('button'); close.className = 'tab-close'; close.textContent = '×'; close.setAttribute('aria-label', label + 'を閉じる'); close.onclick = () => item.remove(); item.append(button, close); tabs.append(item); }
    for (const label of (mode === 'terminal' ? ['ターミナル 1', 'ターミナル 2'] : ['タブ 1', 'タブ 2'])) addSample(label);
    add.onclick = () => addSample('ターミナル ' + (tabs.children.length + 1));
  } catch { document.getElementById('preview-error').textContent = '操作できませんでした。'; }
}
function menuState(view) {
  try {
    const doc = document.getElementById('menu-frame').contentDocument;
    doc.getElementById('menuTitle').textContent = view === 'home' ? 'Beni' : 'サンプルプロジェクト';
    doc.getElementById('homeBtn').classList.toggle('hidden', view === 'home');
    doc.getElementById('projectSettingsBtn').classList.toggle('hidden', view === 'home');
    document.getElementById('preview-error').textContent = '';
  } catch { document.getElementById('preview-error').textContent = '操作できませんでした。'; }
}
function operate(frameId, selector) {
  try {
    const doc = document.getElementById(frameId).contentDocument;
    const button = doc && doc.querySelector(selector);
    if (!button) throw new Error('not ready');
    button.click();
    document.getElementById('preview-error').textContent = '';
  } catch {
    document.getElementById('preview-error').textContent = '操作できませんでした。プレビューが読み込まれているか確認してください。';
  }
}
</script>
</body>

</html>
